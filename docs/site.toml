# markdown docs site, deployed to https://edadma.github.io/markdown/.
#
# Built with juicer (the SSG) and themed with juicerdocs (vendored under
# themes/juicerdocs/ so this repo stays self-contained).
#
# Local preview:
#   sbt 'juicerJVM/run serve -s ../markdown/docs -L'      # from juicer's repo
#
# Production: pushed to `stable`, built + deployed by .github/workflows/docs.yml.

title           = "markdown"
author          = "Ed Maxedon"
baseURL         = "https://edadma.github.io/markdown/"
# repoURL drives the topbar GitHub icon and the "Star on GitHub" hero
# button — both rendered conditionally by juicerdocs when this is set.
repoURL         = "https://github.com/edadma/markdown"

theme           = "juicerdocs"

# The page <h1> comes from frontmatter title — markdown headings start at h2.
headingShift    = 0

# Static-host deploy: URL space must match disk layout. The default 'html'
# segment is a dev-time convenience that doesn't survive GitHub Pages.
htmlDir         = ""

[juicerdocs]
version         = "v0.4.4"

# Load KaTeX from CDN so the markdown library's math-extension output
# renders in the browser. Off by default in the theme; opted in here
# because this is the docs site for the parser that produces math
# output, so we want to demo what it looks like end-to-end.
math            = true

# Brand palette — slate-ink + warm paper, evoking a printed manuscript.
# Distinct from juicer's plum and squiggly's cyan so the three sites read
# as siblings, not clones.
brand           = "#334155"        # slate-700  — primary
brandStrong     = "#1e293b"        # slate-800  — hover
brandSoft       = "#f1f5f9"        # slate-100  — backgrounds
accent          = "#b45309"        # amber-700  — secondary (manuscript ink)
leaf            = "#15803d"        # green-700  — success / leaf

brandDark       = "#cbd5e1"        # slate-300
brandStrongDark = "#e2e8f0"        # slate-200
brandSoftDark   = "rgb(203 213 225 / .12)"
accentDark      = "#fbbf24"        # amber-400
leafDark        = "#4ade80"        # green-400
