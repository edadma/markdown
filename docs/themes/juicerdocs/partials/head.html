<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ if .page.title }}{{ .page.title }} – {{ end }}{{ .site.title }}</title>
{{ if .page.summary }}<meta name="description" content="{{ .page.summary }}" />{{ end }}
<link rel="canonical" href="{{ .page.permalink }}" />
{{ if .site.favicon }}
<link rel="icon" href="{{ relURL .site.favicon }}" />
{{ else }}{{ if .site.juicerdocs.logo }}
<link rel="icon" type="image/png" href="{{ relURL .site.juicerdocs.logo }}" />
{{ end }}{{ end }}
<link rel="alternate" type="application/atom+xml" href="{{ relURL '/feed.xml' }}" title="{{ .site.title }}" />

<!-- Inter font (variable) for clean typography -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" />

<!--
  Apply the theme BEFORE first paint to avoid the white flash.
  Reads localStorage ('juicerdocs-theme'), falls back to system preference.
  Sets data-theme="dark" or data-theme="light" on <html>.
-->
<script>
  (function() {
    try {
      var stored = localStorage.getItem('juicerdocs-theme');
      var dark = stored
        ? stored === 'dark'
        : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    } catch (e) {}
  })();
</script>

<link rel="stylesheet" href="{{ relURL '/juicerdocs.css' }}" />

<!-- Site-supplied stylesheets, loaded AFTER the bundled theme CSS so
     they can override anything. Drop your file in static/site.css and
     set `customCSS = ["site.css"]` in site.toml; the list takes any
     number of paths in the order to load them. -->
{{ if .site.customCSS }}{{ for css <- .site.customCSS }}<link rel="stylesheet" href="{{ relURL css }}" />
{{ end }}{{ end }}

{{ if .site.juicerdocs.math }}
<!--
  Optional math rendering via KaTeX. Opt in with `math = true` under
  [juicerdocs] in site.toml. We pin a recent KaTeX major so future
  releases don't silently change behavior.

  The markdown library emits block math as
    <div class="math display">\[ … \]</div>
  and inline math as
    <span class="math inline">\( … \)</span>
  — both with TeX delimiters that KaTeX's auto-render picks up
  directly. The wrapping div/span give CSS hooks for the host theme
  if it wants to tweak spacing around equations.

  KaTeX is loaded over CDN to keep the theme zero-asset. Sites that
  want to vendor it locally can copy the files into static/ and
  override this partial; the script + stylesheet contract is
  documented above.
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous" />
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk" crossorigin="anonymous"
        onload="renderMathInElement(document.body, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '\\[', right: '\\]', display: true},
            {left: '\\(', right: '\\)', display: false},
            {left: '$', right: '$', display: false}
          ],
          throwOnError: false
        });"></script>
{{ end }}

{{ if .site.juicerdocs }}
<!--
  Site-supplied palette overrides — set under [juicerdocs] in site.toml:
    brand, brandStrong, brandSoft, accent, leaf  (light defaults)
    brandDark, brandStrongDark, brandSoftDark, accentDark, leafDark  (dark overrides)
  Anything left unset falls through to the theme defaults in juicerdocs.css.
-->
<style>
  :root {
    {{ if .site.juicerdocs.brand        }}--brand: {{ .site.juicerdocs.brand }};{{ end }}
    {{ if .site.juicerdocs.brandStrong  }}--brand-strong: {{ .site.juicerdocs.brandStrong }};{{ end }}
    {{ if .site.juicerdocs.brandSoft    }}--brand-soft: {{ .site.juicerdocs.brandSoft }};{{ end }}
    {{ if .site.juicerdocs.accent       }}--accent: {{ .site.juicerdocs.accent }};{{ end }}
    {{ if .site.juicerdocs.leaf         }}--leaf: {{ .site.juicerdocs.leaf }};{{ end }}
    {{ if .site.juicerdocs.fontSans     }}--font-sans: {{ .site.juicerdocs.fontSans }};{{ end }}
    {{ if .site.juicerdocs.fontMono     }}--font-mono: {{ .site.juicerdocs.fontMono }};{{ end }}
    {{ if .site.juicerdocs.contentMax   }}--content-max: {{ .site.juicerdocs.contentMax }};{{ end }}
    {{ if .site.juicerdocs.sidebarW     }}--sidebar-w: {{ .site.juicerdocs.sidebarW }};{{ end }}
    {{ if .site.juicerdocs.railW        }}--rail-w: {{ .site.juicerdocs.railW }};{{ end }}
    {{ if .site.juicerdocs.radiusLg     }}--radius-lg: {{ .site.juicerdocs.radiusLg }};{{ end }}
  }
  [data-theme="dark"] {
    {{ if .site.juicerdocs.brandDark        }}--brand: {{ .site.juicerdocs.brandDark }};{{ end }}
    {{ if .site.juicerdocs.brandStrongDark  }}--brand-strong: {{ .site.juicerdocs.brandStrongDark }};{{ end }}
    {{ if .site.juicerdocs.brandSoftDark    }}--brand-soft: {{ .site.juicerdocs.brandSoftDark }};{{ end }}
    {{ if .site.juicerdocs.accentDark       }}--accent: {{ .site.juicerdocs.accentDark }};{{ end }}
    {{ if .site.juicerdocs.leafDark         }}--leaf: {{ .site.juicerdocs.leafDark }};{{ end }}
  }
</style>
{{ end }}
