<header class="juicerdocs-topbar">
  <div class="juicerdocs-topbar-inner">
    <a href="{{ relURL '/' }}" class="juicerdocs-brand">
      {{ if .site.juicerdocs.logo }}
      <img src="{{ relURL .site.juicerdocs.logo }}" alt="" class="juicerdocs-brand-logo" />
      {{ end }}
      <span class="juicerdocs-brand-name">{{ .site.title }}</span>
    </a>

    <div class="juicerdocs-search">
      <div class="juicerdocs-search-wrap">
        <svg xmlns="http://www.w3.org/2000/svg" class="juicerdocs-search-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-4.3-4.3M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16Z"/>
        </svg>
        <input id="juicerdocs-search" class="juicerdocs-search-input" type="search" placeholder="Search docs…" autocomplete="off" />
      </div>
      <div id="juicerdocs-search-results" class="juicerdocs-search-popup" hidden></div>
    </div>

    <a href="https://github.com/edadma/juicer" aria-label="GitHub repository" target="_blank" rel="noopener noreferrer" class="juicerdocs-icon-btn">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.07 3.29 9.36 7.86 10.88.58.1.79-.25.79-.56v-2c-3.2.7-3.87-1.36-3.87-1.36-.52-1.32-1.27-1.67-1.27-1.67-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.69 1.24 3.35.95.1-.74.4-1.24.72-1.52-2.55-.29-5.23-1.27-5.23-5.66 0-1.25.45-2.27 1.18-3.07-.12-.29-.51-1.46.11-3.04 0 0 .96-.31 3.15 1.18a10.95 10.95 0 0 1 5.74 0c2.19-1.49 3.15-1.18 3.15-1.18.62 1.58.23 2.75.11 3.04.74.8 1.18 1.82 1.18 3.07 0 4.4-2.69 5.36-5.25 5.65.41.36.78 1.06.78 2.13v3.16c0 .31.21.67.8.55C20.21 21.36 23.5 17.07 23.5 12 23.5 5.65 18.35.5 12 .5Z"/></svg>
    </a>

    <button id="juicerdocs-sidebar-toggle" aria-label="Toggle sidebar" class="juicerdocs-icon-btn juicerdocs-sidebar-toggle">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>

    <button id="juicerdocs-theme-toggle" aria-label="Toggle theme" class="juicerdocs-icon-btn">
      <svg xmlns="http://www.w3.org/2000/svg" class="juicerdocs-icon-dark" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/>
      </svg>
      <svg xmlns="http://www.w3.org/2000/svg" class="juicerdocs-icon-light" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364-.707-.707M6.343 6.343l-.707-.707m12.728 0-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z"/>
      </svg>
    </button>
  </div>
</header>
